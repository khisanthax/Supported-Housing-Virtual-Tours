name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  capture-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node capture/camera-test.mjs
      - run: node capture/test-backup-browser.mjs
      - run: node capture/recovery-browser-test.mjs
      - run: node capture/quality-test.mjs
      - run: node capture/calibration-browser-test.mjs
      - run: node capture/fov-test.mjs
      - run: node capture/guidance-browser-test.mjs
      - run: node capture/browser-test.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node cloudflare/prepare.mjs
  local-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local:browser
        env:
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
      - run: npm run test:local:browser
        env:
          LOCAL_TEST_NO_INSTALL: '1'
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-browser-evidence
      - run: node local/migration-test.mjs "${{ runner.temp }}/local-tours-evidence/synthetic-roundtrip.shtour.zip"
        env:
          CAPTURE_TEST: '1'
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
