name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node cloudflare/prepare.mjs
      - run: npm run test:agency:emulator
      - run: npm run test:agency:update:emulator
  local-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The hosted desktop image includes browser system libraries. Browser
      # launch/tests still fail normally if those prerequisites ever disappear.
      - run: npx playwright install chromium
      - run: npm run test:local:browser
        env:
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
      - run: npm run test:agency:browser
      - run: node local/migration-test.mjs "${{ runner.temp }}/local-tours-evidence/synthetic-roundtrip.shtour.zip"
        env:
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
