name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run test:official
  local-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:official -- --browser
      - run: npm run test:local:browser
        env:
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
      - run: node local/migration-test.mjs "${{ runner.temp }}/local-tours-evidence/synthetic-roundtrip.shtour.zip"
        env:
          LOCAL_TEST_OUTPUT: ${{ runner.temp }}/local-tours-evidence
