<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff accounts · Supported Housing</title><link rel="stylesheet" href="/sharing/sharing.css">
<script type="module" src="/sharing/staff-accounts.js"></script></head>
<body><main class="narrow"><p><a href="/staff">Back to staff catalog</a></p>
<h1>Staff accounts</h1>
<p id="message" role="status"></p>
<section class="panel"><h2 id="create-title">Add a staff account</h2><form id="create" method="post">
<label>Username<input name="username" required minlength="3" maxlength="64" autocomplete="off"></label>
<label>Role<select name="role"><option value="editor">Staff Editor</option><option value="administrator">Administrator</option></select></label>
<label hidden>Firebase user UID<input name="firebaseUid" disabled required maxlength="128" autocomplete="off"></label>
<label hidden>Firebase email<input name="email" disabled required maxlength="254" type="email" autocomplete="off"></label>
<label hidden>Password<input name="password" disabled required type="password" minlength="15" maxlength="256" autocomplete="new-password">
<small>Use at least 15 characters.</small></label>
<button disabled>Add account</button></form></section>
<section class="panel"><h2>Manage an account</h2>
<ul id="accounts"></ul>
<form id="manage" method="post"><label>Account<select name="username" required></select></label>
<label>Action<select name="action"><option value="reset">Reset password</option><option value="disable">Disable account</option><option value="enable">Enable account</option></select></label>
<label hidden>New password<input name="password" disabled required type="password" minlength="15" maxlength="256" autocomplete="new-password">
<small>Use at least 15 characters.</small></label>
<button disabled>Apply change</button></form></section>
</main></body></html>
