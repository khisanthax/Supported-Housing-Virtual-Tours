<section class="sharing-shell"><header class="sharing-heading"><div><h1>Guest Links & Sharing</h1><p>Create, manage, and share guest view links for your apartment tours.</p></div><input id="share-search" type="search" placeholder="Search apartments…" aria-label="Search apartments"></header><nav class="share-toolbar" aria-label="Share options"><strong>Share Options</strong><button data-share="link">↗ Copy Link</button><button data-share="qr">▦ QR Code</button><button data-share="email">✉ Email</button><button data-share="sms">▢ Text / SMS</button><button id="mass-toggle" aria-expanded="false" aria-controls="mass-panel">♧ Group / Mass Share</button><button id="share-more">••• More</button></nav><section id="mass-panel" hidden><div><h2>Mass Share Selected Tours</h2><p>Create one share link for multiple apartments.</p></div><label>Expires in<select id="mass-expiration"><option value="1d">1 Day</option><option value="7d">7 Days</option><option value="30d">30 Days</option><option value="3m" selected>3 Months (Default)</option><option value="6m">6 Months</option></select></label><button id="mass-create" disabled>Copy Link for Selected</button><div class="selection-tools"><strong id="selected-count">0 Selected</strong><button id="select-eligible">Select All Eligible</button><button id="clear-selected">Clear Selection</button><button id="exit-mass">Exit Mass Share</button></div></section><div id="share-gallery" class="share-gallery"></div><p id="share-summary"></p></section>
